<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #2E3192, #1BFFFF);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            animation: fade 0.7s ease-in-out;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: #2E3192;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #2E3192;
            box-shadow: 0px 0px 8px rgba(46,49,146,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2E3192;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1BFFFF;
            color: #2E3192;
            border: 2px solid #2E3192;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #2E3192;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="container">
        <h2>Teacher Registration</h2>

        <form method="POST">
        

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="fullname" required placeholder="Enter full name">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="Enter email">
            </div>

            <div class="input-group">
                <label>Department</label>
                <select name="department" required>
                    <option value="">-- Select Department --</option>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>IT</option>
                    <option>CIVIL</option>
                    <option>MECH</option>
                </select>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" name="phone" required placeholder="Enter phone number">
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Create username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Create password">
            </div>

            <button type="submit">Register</button>

            <div class="login-link">
                Already have an account? <a href="/teacher_login">Login</a>
            </div>

        </form>
    </div>

</body>
</html>
