<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Login</title>
    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            font-family:Arial, Helvetica, sans-serif;
        }
        .login-box{
            width:340px;
            padding:30px;
            background:#ffffff;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.25);
        }
        h2{
            text-align:center;
            margin-bottom:20px;
        }
        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:14px;
        }
        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            border:none;
            border-radius:20px;
            background:#1e3c72;
            color:white;
            font-size:15px;
            cursor:pointer;
        }
        button:hover{
            background:#16305c;
        }
        .footer{
            text-align:center;
            font-size:12px;
            margin-top:10px;
            color:#666;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Teacher Login</h2>
    <form>
        <input type="text" placeholder="Teacher ID / Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <div class="footer">© Academic Portal</div>
</div>

</body>
</html>
