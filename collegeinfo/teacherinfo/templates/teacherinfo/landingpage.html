{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaagdevi College of Engineering</title>

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #2E3192, #1BFFFF);
            height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-left img {
            height: 50px;
            width: auto;
            border-radius: 5px;
        }

        .nav-left h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            color: #2E3192;
        }

        .nav-right a {
            margin-left: 25px;
            text-decoration: none;
            color: #2E3192;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-right a:hover {
            color: #1BFFFF;
        }

        /* MAIN CONTENT */
        .main {
            margin-top: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main img {
            width: 55%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0px 6px 20px rgba(0,0,0,0.25);
            animation: fadeIn 1s ease-in-out;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-left">
            <img src="{% static 'vaag_logo.jpg' %}" alt="College Logo">
            <h2>Vaagdevi College of Engineering</h2>
        </div>

        <div class="nav-right">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/teacher_register">Teacher Register</a>
            <a href="/teacher_login">Login</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <img src="{% static 'vaag4k.jpg' %}" alt="Vaagdevi College Image">
    </div>

</body>
</html>
